<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Néon Tennis 2D - Local Multijoueur</title>
    <style>
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            border: 2px solid #00FFFF;
            /* Bordure néon */
            box-shadow: 0 0 20px #00FFFF, 0 0 10px #00FFFF inset;
            background-color: #000033;
            /* Fond sombre pour le style néon */
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        // --- CONFIGURATION DU JEU ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        // COULEURS NÉON
        const COLOR_P1 = '#FF6666'; // Rouge/Rose Néon
        const COLOR_P2 = '#66CCFF'; // Bleu Ciel Néon
        const COLOR_BALL = '#FFFF00'; // Jaune Néon
        const COLOR_LINES = '#00FF00'; // Vert Néon

        // PARAMÈTRES DU JEU
        const RACKET_WIDTH = 60;
        const RACKET_HEIGHT_CLOSE = 10;
        const RACKET_HEIGHT_FAR = 4;
        const PLAYER_SPEED_X = 5;
        const PLAYER_SPEED_Y = 2; // Déplacement lent vers l'avant/arrière
        const MAX_BALL_VELOCITY_INITIAL = 12;
        let maxBallVelocity = MAX_BALL_VELOCITY_INITIAL;

        // ZONE DE JEU EN PERSPECTIVE (Y est l'axe de profondeur)
        const NET_Y = H / 2; // Position du filet (milieu de l'écran)
        const COURT_WIDTH_CLOSE = W * 0.9; // Largeur du terrain en bas
        const COURT_WIDTH_FAR = W * 0.6; // Largeur du terrain en haut
        const BASELINE_P1 = H - 50; // Ligne de fond J1
        const BASELINE_P2 = 50; // Ligne de fond J2
        const COURT_LEFT_CLOSE = (W - COURT_WIDTH_CLOSE) / 2;
        const COURT_LEFT_FAR = (W - COURT_WIDTH_FAR) / 2;

        // SCORE
        const scoreNames = [0, 15, 30, 40, 'Avantage', 'Jeu'];
        let scoreP1 = 0;
        let scoreP2 = 0;
        let gamesP1 = 0;
        let gamesP2 = 0;
        let advantage = 0; // 1 pour P1, -1 pour P2

        // ÉTAT DU JEU
        let isServing = true;
        let server = 1; // 1 pour P1, 2 pour P2
        let gameActive = true;
        let message = "Appuyez sur ESPACE ou ENTREE pour SERVIR!";
        let hitCooldown = false;
        const HIT_COOLDOWN_TIME = 200; // ms

        // --- OBJETS DU JEU ---

        const player1 = {
            x: W / 2,
            y: BASELINE_P1,
            dx: 0,
            dy: 0,
            color: COLOR_P1
        };

        const player2 = {
            x: W / 2,
            y: BASELINE_P2,
            dx: 0,
            dy: 0,
            color: COLOR_P2
        };

        const ball = {
            x: W / 2,
            y: BASELINE_P1,
            vx: 0,
            vy: 0,
            radius: 5,
            color: COLOR_BALL
        };

        // --- CONTRÔLES ---

        const keys = {};

        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (isServing && (e.key === ' ' && server === 1 || e.key === 'Enter' && server === 2)) {
                serveBall();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // --- LOGIQUE DE PERSPECTIVE ---

        /**
         * Calcule le rayon de la balle en fonction de sa position Y (profondeur).
         * @param {number} y - Position Y de la balle.
         * @returns {number} Le rayon ajusté.
         */
        function getBallRadius(y) {
            // Mapping de Y sur un rayon entre min et max
            // Plus Y est petit (près du haut/loin), plus le rayon est petit.
            const minR = 3;
            const maxR = 8;
            const ratio = (H - y) / H; // 0 en haut, 1 en bas
            return minR + ratio * (maxR - minR);
        }

        /**
         * Calcule la largeur du terrain à une position Y donnée.
         * @param {number} y - Position Y.
         * @returns {number} La largeur du terrain.
         */
        function getCourtWidth(y) {
            // Interpolation linéaire de la largeur du terrain
            const ratio = (y - BASELINE_P2) / (BASELINE_P1 - BASELINE_P2);
            return COURT_WIDTH_FAR + ratio * (COURT_WIDTH_CLOSE - COURT_WIDTH_FAR);
        }

        /**
         * Calcule la position X du bord gauche du terrain à une position Y donnée.
         * @param {number} y - Position Y.
         * @returns {number} La position X du bord gauche.
         */
        function getCourtLeft(y) {
            return (W - getCourtWidth(y)) / 2;
        }

        /**
         * Calcule la hauteur visuelle de la raquette en fonction de sa position Y.
         * @param {number} y - Position Y du joueur.
         * @returns {number} La hauteur ajustée.
         */
        function getRacketHeight(y) {
            const ratio = (y - BASELINE_P2) / (BASELINE_P1 - BASELINE_P2);
            return RACKET_HEIGHT_FAR + ratio * (RACKET_HEIGHT_CLOSE - RACKET_HEIGHT_FAR);
        }

        // --- FONCTIONS DE DESSIN (GRAPHS STYLISÉS) ---

        function drawCourt() {
            ctx.strokeStyle = COLOR_LINES;
            ctx.lineWidth = 2;
            ctx.shadowColor = COLOR_LINES;
            ctx.shadowBlur = 8;

            // 1. Lignes de fond et de côté (polygone)
            ctx.beginPath();
            // Bas (Proche - P1)
            ctx.moveTo(COURT_LEFT_CLOSE, BASELINE_P1);
            ctx.lineTo(COURT_LEFT_CLOSE + COURT_WIDTH_CLOSE, BASELINE_P1);
            // Côté Droit
            ctx.lineTo(COURT_LEFT_FAR + COURT_WIDTH_FAR, BASELINE_P2);
            // Haut (Loin - P2)
            ctx.lineTo(COURT_LEFT_FAR, BASELINE_P2);
            // Côté Gauche
            ctx.lineTo(COURT_LEFT_CLOSE, BASELINE_P1);
            ctx.stroke();

            // 2. Filet (Net)
            ctx.beginPath();
            const netWidth = getCourtWidth(NET_Y);
            const netLeft = getCourtLeft(NET_Y);
            ctx.moveTo(netLeft, NET_Y);
            ctx.lineTo(netLeft + netWidth, NET_Y);
            ctx.stroke();

            // 3. Ligne de fond (P1)
            ctx.beginPath();
            ctx.moveTo(COURT_LEFT_CLOSE, BASELINE_P1);
            ctx.lineTo(COURT_LEFT_CLOSE + COURT_WIDTH_CLOSE, BASELINE_P1);
            ctx.stroke();

            // 4. Ligne de fond (P2)
            ctx.beginPath();
            ctx.moveTo(COURT_LEFT_FAR, BASELINE_P2);
            ctx.lineTo(COURT_LEFT_FAR + COURT_WIDTH_FAR, BASELINE_P2);
            ctx.stroke();

            ctx.shadowBlur = 0; // Réinitialiser pour le reste
        }

        function drawPlayer(player) {
            const racketH = getRacketHeight(player.y);
            const racketW = RACKET_WIDTH * (getCourtWidth(player.y) / COURT_WIDTH_CLOSE); // Taille de raquette proportionnelle à la profondeur

            ctx.fillStyle = player.color;
            ctx.shadowColor = player.color;
            ctx.shadowBlur = 15;

            // Dessin de la raquette (rectangle stylisé)
            ctx.fillRect(
                player.x - racketW / 2,
                player.y - racketH / 2,
                racketW,
                racketH
            );

            ctx.shadowBlur = 0;
        }

        function drawBall(ball) {
            ball.radius = getBallRadius(ball.y);

            ctx.fillStyle = ball.color;
            ctx.shadowColor = ball.color;
            ctx.shadowBlur = 10;

            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
        }

        function drawScore() {
            ctx.font = '24px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 5;

            // Score du Jeu
            let scoreTextP1 = scoreNames[scoreP1];
            let scoreTextP2 = scoreNames[scoreP2];
            if (scoreP1 >= 3 && scoreP2 >= 3) {
                if (advantage === 1) scoreTextP1 = scoreNames[4];
                else if (advantage === -1) scoreTextP2 = scoreNames[4];
                else if (scoreP1 === 3 && scoreP2 === 3) {
                    scoreTextP1 = '40';
                    scoreTextP2 = '40';
                } // 40-40 (Deuce)
            }


            // Affichage du score du jeu
            ctx.fillStyle = COLOR_P1;
            ctx.shadowColor = COLOR_P1;
            ctx.fillText(`J1: ${scoreTextP1}`, W / 4, H / 2 + 50);

            ctx.fillStyle = COLOR_P2;
            ctx.shadowColor = COLOR_P2;
            ctx.fillText(`J2: ${scoreTextP2}`, 3 * W / 4, H / 2 - 30);

            // Affichage des jeux gagnés
            ctx.fillStyle = COLOR_LINES;
            ctx.shadowColor = COLOR_LINES;
            ctx.fillText(`Jeu J1: ${gamesP1}`, W / 4, H / 2 + 80);
            ctx.fillText(`Jeu J2: ${gamesP2}`, 3 * W / 4, H / 2 - 60);

            // Message central
            ctx.font = '20px "Courier New", monospace';
            ctx.fillStyle = COLOR_BALL;
            ctx.shadowColor = COLOR_BALL;
            ctx.fillText(message, W / 2, H / 2 + 10);
            ctx.shadowBlur = 0;
        }

        // --- LOGIQUE DU JEU ---

        function handleInput() {
            if (!gameActive) return;

            // --- Joueur 1 (Bas / Rouge) ---
            player1.dx = 0;
            player1.dy = 0;

            if (keys['q']) player1.dx = -PLAYER_SPEED_X;
            if (keys['d']) player1.dx = PLAYER_SPEED_X;
            if (keys['z']) player1.dy = -PLAYER_SPEED_Y; // Avance vers le filet
            if (keys['s']) player1.dy = PLAYER_SPEED_Y; // Recule

            // --- Joueur 2 (Haut / Bleu) ---
            player2.dx = 0;
            player2.dy = 0;

            if (keys['ArrowLeft']) player2.dx = -PLAYER_SPEED_X;
            if (keys['ArrowRight']) player2.dx = PLAYER_SPEED_X;
            if (keys['ArrowUp']) player2.dy = PLAYER_SPEED_Y; // Avance vers le filet (Y décroissant)
            if (keys['ArrowDown']) player2.dy = -PLAYER_SPEED_Y; // Recule (Y croissant)
            // Note: Inverser les touches Y pour P2 car y petit est "loin"
        }

        function updatePlayers() {
            // Mise à jour de la position de P1
            player1.x += player1.dx;
            player1.y += player1.dy;

            // Mise à jour de la position de P2
            player2.x += player2.dx;
            // Inverser la direction Y de P2 pour que 'ArrowUp' (dy positif) déplace vers le haut (y petit)
            player2.y -= player2.dy;


            // Contraintes de position pour P1
            const courtW1 = getCourtWidth(player1.y);
            const courtL1 = getCourtLeft(player1.y);
            player1.x = Math.max(courtL1 + RACKET_WIDTH / 2, Math.min(courtL1 + courtW1 - RACKET_WIDTH / 2, player1.x));
            player1.y = Math.max(NET_Y + 10, Math.min(BASELINE_P1, player1.y)); // Limite entre le filet et la ligne de fond P1

            // Contraintes de position pour P2
            const courtW2 = getCourtWidth(player2.y);
            const courtL2 = getCourtLeft(player2.y);
            player2.x = Math.max(courtL2 + RACKET_WIDTH / 2, Math.min(courtL2 + courtW2 - RACKET_WIDTH / 2, player2.x));
            player2.y = Math.max(BASELINE_P2, Math.min(NET_Y - 10, player2.y)); // Limite entre la ligne de fond P2 et le filet
        }

        function resetBall(scorer) {
            isServing = true;
            server = scorer;
            gameActive = true;
            ball.vx = 0;
            ball.vy = 0;

            if (server === 1) {
                ball.x = player1.x;
                ball.y = player1.y;
                message = "J1 SERVEZ (ESPACE)";
            } else {
                ball.x = player2.x;
                ball.y = player2.y;
                message = "J2 SERVEZ (ENTREE)";
            }
        }

        function serveBall() {
            if (!isServing || hitCooldown) return;
            isServing = false;
            hitCooldown = true;
            setTimeout(() => { hitCooldown = false; }, HIT_COOLDOWN_TIME);

            // Angle et vitesse de base
            const speed = 10;
            const angleDeg = server === 1 ? -80 : 80; // Toujours vers l'adversaire

            ball.vy = speed * Math.cos(angleDeg * Math.PI / 180) * (server === 1 ? -1 : 1);
            ball.vx = speed * Math.sin(angleDeg * Math.PI / 180);
            message = "";
        }

        function hitBall(player) {
            if (hitCooldown) return;

            // Cooldown pour éviter le spam
            hitCooldown = true;
            setTimeout(() => { hitCooldown = false; }, HIT_COOLDOWN_TIME);

            const isP1 = player === player1;
            const courtW = getCourtWidth(player.y);
            const courtL = getCourtLeft(player.y);
            const racketW = RACKET_WIDTH * (courtW / COURT_WIDTH_CLOSE);

            // Calcul de l'angle en fonction de la position du coup (Centre = Angle droit, Bord = Angle ouvert)
            const relativeHitX = player.x - courtL;
            const hitRatio = (relativeHitX - courtW / 2) / (courtW / 2); // Entre -1 (Gauche) et 1 (Droite)

            const maxAngleOffset = 45; // Max 45 degrés d'angle par rapport à la perpendiculaire
            let angleOffset = hitRatio * maxAngleOffset; // En degrés

            // Vitesse de base déterminée par la vitesse max actuelle
            let speed = maxBallVelocity;

            // Détermination de l'angle final
            let baseAngle = isP1 ? -90 : 90; // -90 deg (vers le haut), 90 deg (vers le bas)
            let finalAngle = baseAngle + angleOffset; // En degrés

            // Mise à jour de la vitesse de la balle
            ball.vy = speed * Math.cos(finalAngle * Math.PI / 180) * (isP1 ? -1 : 1);
            ball.vx = speed * Math.sin(finalAngle * Math.PI / 180);

            // Empêcher de frapper la balle en dehors du filet
            if (isP1 && ball.y < NET_Y) {
                ball.vy = -ball.vy;
            } else if (!isP1 && ball.y > NET_Y) {
                ball.vy = -ball.vy;
            }

            // Remettre la balle devant la raquette pour la suite
            ball.y = player.y + (isP1 ? -ball.radius : ball.radius);
            ball.x = player.x;
        }

        function checkScore(scorer) {
            let p1 = scoreP1;
            let p2 = scoreP2;
            let winner = 0;

            if (scorer === 1) p1++;
            else p2++;

            if (p1 >= 4 && p1 > p2 + 1) winner = 1;
            else if (p2 >= 4 && p2 > p1 + 1) winner = 2;
            else if (p1 >= 3 && p2 >= 3) { // 40-40 ou Avantage
                if (p1 > p2) advantage = 1; // Avantage P1
                else if (p2 > p1) advantage = -1; // Avantage P2
                else { // Égalité (40-40)
                    advantage = 0;
                    p1 = 3;
                    p2 = 3;
                }
            } else {
                scoreP1 = p1;
                scoreP2 = p2;
            }

            if (winner > 0) {
                if (winner === 1) gamesP1++;
                else gamesP2++;

                maxBallVelocity += 0.5; // Augmentation de la difficulté
                scoreP1 = 0;
                scoreP2 = 0;
                advantage = 0;
                resetBall(winner); // Le gagnant du jeu sert
            } else if (winner === 0) {
                scoreP1 = p1;
                scoreP2 = p2;
            }
        }

        function updateBall() {
            if (isServing) return;

            // Mise à jour de la position de la balle
            ball.x += ball.vx;
            ball.y += ball.vy;

            // --- Collisions avec les murs latéraux du terrain (perspective) ---
            const courtW = getCourtWidth(ball.y);
            const courtL = getCourtLeft(ball.y);

            // Balle en dehors des limites X
            if (ball.x - ball.radius < courtL || ball.x + ball.radius > courtL + courtW) {
                ball.vx = -ball.vx * 0.95; // Inversion et légère perte de vitesse
                // Recalculer la position pour la maintenir dans le terrain
                if (ball.x - ball.radius < courtL) ball.x = courtL + ball.radius;
                if (ball.x + ball.radius > courtL + courtW) ball.x = courtL + courtW - ball.radius;
            }

            // --- Collisions avec le filet (Net) ---
            if (Math.abs(ball.y - NET_Y) < ball.radius && ball.x > getCourtLeft(NET_Y) && ball.x < getCourtLeft(NET_Y) + getCourtWidth(NET_Y)) {
                if (ball.y < NET_Y && ball.vy > 0) { // Du haut vers le bas
                    ball.vy = -ball.vy * 0.5; // La balle ralentit fortement sur le filet
                } else if (ball.y > NET_Y && ball.vy < 0) { // Du bas vers le haut
                    ball.vy = -ball.vy * 0.5; // La balle ralentit fortement sur le filet
                }
            }

            // --- Détection de frappe (Collision raquette) ---
            // P1 (Bas)
            if (keys[' '] && !isServing && !hitCooldown && ball.vy > 0 && ball.y + ball.radius >= player1.y - getRacketHeight(player1.y) / 2 && ball.y < NET_Y) {
                const racketW = RACKET_WIDTH * (getCourtWidth(player1.y) / COURT_WIDTH_CLOSE);
                if (ball.x >= player1.x - racketW / 2 && ball.x <= player1.x + racketW / 2) {
                    hitBall(player1);
                    return;
                }
            }

            // P2 (Haut)
            if (keys['Enter'] && !isServing && !hitCooldown && ball.vy < 0 && ball.y - ball.radius <= player2.y + getRacketHeight(player2.y) / 2 && ball.y > NET_Y) {
                const racketW = RACKET_WIDTH * (getCourtWidth(player2.y) / COURT_WIDTH_CLOSE);
                if (ball.x >= player2.x - racketW / 2 && ball.x <= player2.x + racketW / 2) {
                    hitBall(player2);
                    return;
                }
            }

            // --- Hors-jeu (Point marqué) ---
            // Hors-jeu P2 (Balle passe P2 sans coup ou rebond sur la ligne)
            if (ball.y < BASELINE_P2) {
                message = "POINT J1!";
                gameActive = false;
                setTimeout(() => {
                    checkScore(1);
                    gameActive = true;
                }, 1000);
                return;
            }
            // Hors-jeu P1 (Balle passe P1 sans coup ou rebond sur la ligne)
            if (ball.y > BASELINE_P1) {
                message = "POINT J2!";
                gameActive = false;
                setTimeout(() => {
                    checkScore(2);
                    gameActive = true;
                }, 1000);
                return;
            }
        }


        // --- BOUCLE DE JEU ---

        function gameLoop() {
            // 1. Mise à jour des entrées
            handleInput();

            // 2. Mise à jour de la logique
            if (gameActive) {
                updatePlayers();
                updateBall();
            }

            // 3. Dessin
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#000033'; // Réinitialisation du fond
            ctx.fillRect(0, 0, W, H);

            drawCourt();
            drawPlayer(player1);
            drawPlayer(player2);
            drawBall(ball);
            drawScore();

            requestAnimationFrame(gameLoop);
        }

        // --- DÉMARRAGE DU JEU ---
        resetBall(server); // Initialiser la balle au centre du serveur P1
        gameLoop();
    </script>
</body>

</html>
