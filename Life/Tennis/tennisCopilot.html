<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tennis 2D — Multijoueur local</title>
    <style>
        :root {
            --bg: #0b3b2e;
            --court: #2b8f6b;
            --line: #ffffff;
            --net: #e6e6e6;
            --hud-bg: rgba(0, 0, 0, 0.45);
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: Inter, Segoe UI, Arial, sans-serif;
            background: linear-gradient(#063, #012);
            color: #fff
        }

        .wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 18px
        }

        canvas {
            background: linear-gradient(#0b5, #073);
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6)
        }

        .hud {
            display: flex;
            gap: 12px;
            align-items: center
        }

        .panel {
            background: var(--hud-bg);
            padding: 8px 12px;
            border-radius: 8px
        }

        .score {
            font-size: 20px;
            font-weight: 700
        }

        .controls {
            font-size: 13px;
            opacity: 0.9
        }

        button {
            padding: 8px 12px;
            border-radius: 6px;
            border: 0;
            background: #fff;
            color: #000;
            cursor: pointer
        }

        small {
            opacity: 0.85
        }

        @media (max-width:700px) {
            canvas {
                width: 360px;
                height: 600px
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="hud">
            <div class="panel">
                <div class="score" id="scoreText">0 - 0</div>
                <div style="font-size:12px" id="gameText">Jeu 0 - 0</div>
            </div>
            <div class="panel controls">
                <div><strong>Gauche (Bleu)</strong> : W A S D — <strong>Servir</strong> F</div>
                <div><strong>Droite (Rouge)</strong> : ↑ ← ↓ → — <strong>Servir</strong> K</div>
                <div style="margin-top:6px"><small>P : Pause • R : Reset</small></div>
            </div>
            <div style="display:flex;gap:8px;align-items:center">
                <button id="resetBtn">Reset</button>
                <button id="pauseBtn">Pause</button>
            </div>
        </div>

        <canvas id="c" width="800" height="1200"></canvas>
        <div style="width:800px;max-width:95%;text-align:left;color:#ddd;font-size:13px">
            <p><strong>Notes :</strong> Le jeu est conçu pour être simple et extensible. Vous pouvez ajuster la
                physique, ajouter IA, animations, sons, ou réseau.</p>
        </div>
    </div>

    <script>
        /* ---------------------------
           Tennis 2D — Multijoueur local
           Auteur : Expert Creative Coder (exemple)
           --------------------------- */

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let W = canvas.width;
        let H = canvas.height;

        // Resize handler for responsive canvas (keeps internal resolution)
        function fitCanvas() {
            const ratio = window.devicePixelRatio || 1;
            const cssW = Math.min(window.innerWidth - 40, 800);
            const cssH = Math.min(window.innerHeight - 140, 1200);
            canvas.style.width = cssW + 'px';
            canvas.style.height = cssH + 'px';
        }
        fitCanvas();
        window.addEventListener('resize', fitCanvas);

        // Game constants
        const COURT_MARGIN = 60;
        const NET_HEIGHT = 8;
        const NET_Y = H / 2;
        const PADDLE_WIDTH = 18;
        const PADDLE_HEIGHT = 80;
        const BALL_RADIUS = 10;
        const MAX_SCORE = 6;
        const MAX_GAMES = 10;

        // Utility
        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
        function rand(min, max) { return Math.random() * (max - min) + min; }

        // Perspective helper: scale objects by y position to simulate depth
        function perspectiveScale(y) {
            // y from 0 (top) to H (bottom). We want center (net) to be farthest.
            // Map distance from bottom to scale factor
            const near = 1.0; // bottom (closer to camera)
            const far = 0.6;  // top (farther)
            const t = y / H;
            return far + (near - far) * t;
        }

        // Player class
        class Player {
            constructor(side) {
                this.side = side; // 'left' or 'right'
                this.width = PADDLE_WIDTH;
                this.height = PADDLE_HEIGHT;
                this.speed = 6;
                this.x = side === 'left' ? COURT_MARGIN + 40 : W - COURT_MARGIN - 40 - this.width;
                this.y = H / 2 - this.height / 2;
                this.color = side === 'left' ? '#2ea6ff' : '#ff6b6b';
                this.score = 0; // games won
                this.games = 0; // games count
                this.isServing = false;
                this.controls = { up: false, down: false, left: false, right: false, serve: false };
            }
            update() {
                let dx = 0, dy = 0;
                if (this.controls.up) dy -= this.speed;
                if (this.controls.down) dy += this.speed;
                if (this.controls.left) dx -= this.speed;
                if (this.controls.right) dx += this.speed;
                // Movement bounds within court area
                const leftBound = COURT_MARGIN;
                const rightBound = W - COURT_MARGIN - this.width;
                const topBound = 40;
                const bottomBound = H - 40 - this.height;
                this.x = clamp(this.x + dx, leftBound, rightBound);
                this.y = clamp(this.y + dy, topBound, bottomBound);
            }
            draw() {
                // Draw paddle with perspective scaling by its center y
                const scale = perspectiveScale(this.y + this.height / 2);
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.scale(scale, scale);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
                // handle/grip
                ctx.fillStyle = 'rgba(0,0,0,0.12)';
                ctx.fillRect(-this.width / 2, this.height / 4, this.width, this.height / 8);
                ctx.restore();
            }
            getBounds() {
                return {
                    x: this.x,
                    y: this.y,
                    w: this.width,
                    h: this.height
                };
            }
        }

        // Ball class
        class Ball {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = W / 2;
                this.y = H / 2;
                this.vx = 0;
                this.vy = 0;
                this.radius = BALL_RADIUS;
                this.inPlay = false; // waiting for serve
                this.lastHitBy = null; // 'left' or 'right'
            }
            serve(fromPlayer) {
                // Place ball near server and launch toward opponent
                const p = fromPlayer;
                const dir = p.side === 'left' ? 1 : -1;
                // place ball in front of paddle
                this.x = p.x + (p.side === 'left' ? p.width + this.radius + 6 : -this.radius - 6);
                this.y = p.y + p.height / 2;
                // initial velocity with slight vertical randomness
                const speed = 8;
                this.vx = dir * speed;
                this.vy = rand(-2, 2);
                this.inPlay = true;
                this.lastHitBy = p.side;
            }
            update() {
                if (!this.inPlay) return;
                // simple physics
                this.x += this.vx;
                this.y += this.vy;
                // gravity-like effect to add arc
                // but keep subtle for tennis feel
                this.vy += 0.08;
                // friction/air resistance
                this.vx *= 0.999;
                this.vy *= 0.999;
            }
            draw() {
                const scale = perspectiveScale(this.y);
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(scale, scale);
                // shadow
                ctx.beginPath();
                ctx.fillStyle = 'rgba(0,0,0,0.18)';
                ctx.ellipse(0, this.radius * 1.6, this.radius * 1.6, this.radius * 0.8, 0, 0, Math.PI * 2);
                ctx.fill();
                // ball
                ctx.beginPath();
                ctx.fillStyle = '#fff';
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                // seam
                ctx.strokeStyle = '#f2b';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(-this.radius * 0.6, -this.radius * 0.6);
                ctx.quadraticCurveTo(0, 0, this.radius * 0.6, this.radius * 0.6);
                ctx.stroke();
                ctx.restore();
            }
        }

        // Game manager
        class Game {
            constructor() {
                this.left = new Player('left');
                this.right = new Player('right');
                this.ball = new Ball();
                this.server = this.left; // left starts serving
                this.receiver = this.right;
                this.state = 'serve'; // 'serve', 'play', 'point', 'paused', 'gameover'
                this.pointWinner = null;
                this.scoreText = document.getElementById('scoreText');
                this.gameText = document.getElementById('gameText');
                this.pauseBtn = document.getElementById('pauseBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.bindUI();
                this.lastUpdate = performance.now();
                this.loop = this.loop.bind(this);
                this.updateHUD();
                requestAnimationFrame(this.loop);
            }
            bindUI() {
                // Buttons
                this.resetBtn.addEventListener('click', () => this.resetMatch());
                this.pauseBtn.addEventListener('click', () => this.togglePause());
                // Keyboard
                window.addEventListener('keydown', (e) => this.onKey(e, true));
                window.addEventListener('keyup', (e) => this.onKey(e, false));
            }
            onKey(e, down) {
                const code = e.key;
                // Left player controls (WASD + F)
                if (code === 'w' || code === 'W') this.left.controls.up = down;
                if (code === 's' || code === 'S') this.left.controls.down = down;
                if (code === 'a' || code === 'A') this.left.controls.left = down;
                if (code === 'd' || code === 'D') this.left.controls.right = down;
                if (code === 'f' || code === 'F') {
                    if (down) this.left.controls.serve = true;
                    else this.left.controls.serve = false;
                }
                // Right player controls (arrows + K)
                if (code === 'ArrowUp') this.right.controls.up = down;
                if (code === 'ArrowDown') this.right.controls.down = down;
                if (code === 'ArrowLeft') this.right.controls.left = down;
                if (code === 'ArrowRight') this.right.controls.right = down;
                if (code === 'k' || code === 'K') {
                    if (down) this.right.controls.serve = true;
                    else this.right.controls.serve = false;
                }
                // Pause / Reset
                if (code === 'p' || code === 'P') {
                    if (down) this.togglePause();
                }
                if (code === 'r' || code === 'R') {
                    if (down) this.resetMatch();
                }
                // Serve handling: only on keydown and when in serve state
                if (down && this.state === 'serve') {
                    if (this.server === this.left && (code === 'f' || code === 'F')) {
                        this.ball.serve(this.left);
                        this.state = 'play';
                    } else if (this.server === this.right && (code === 'k' || code === 'K')) {
                        this.ball.serve(this.right);
                        this.state = 'play';
                    }
                }
            }
            togglePause() {
                if (this.state === 'paused') this.state = 'play';
                else if (this.state === 'play' || this.state === 'serve') this.state = 'paused';
                this.updateHUD();
            }
            resetMatch() {
                this.left.score = 0; this.right.score = 0;
                this.left.games = 0; this.right.games = 0;
                this.server = this.left;
                this.receiver = this.right;
                this.ball.reset();
                this.state = 'serve';
                this.updateHUD();
            }
            updateHUD() {
                this.scoreText.textContent = `${this.left.games} - ${this.right.games}`;
                this.gameText.textContent = `État : ${this.state.toUpperCase()} • Serveur : ${this.server.side.toUpperCase()}`;
                this.pauseBtn.textContent = (this.state === 'paused') ? 'Reprendre' : 'Pause';
            }
            loop(now) {
                const dt = now - this.lastUpdate;
                this.lastUpdate = now;
                if (this.state !== 'paused' && this.state !== 'gameover') {
                    this.update(dt / 16.666);
                }
                this.render();
                requestAnimationFrame(this.loop);
            }
            update(scale) {
                // Update players
                this.left.update();
                this.right.update();

                // If in serve state, position ball near server's paddle
                if (this.state === 'serve') {
                    // place ball in front of server paddle for aiming
                    const p = this.server;
                    this.ball.x = p.x + (p.side === 'left' ? p.width + this.ball.radius + 6 : -this.ball.radius - 6);
                    this.ball.y = p.y + p.height / 2;
                    this.ball.inPlay = false;
                    // allow server to reposition
                    return;
                }

                // Update ball
                this.ball.update();

                // Collisions with top/bottom bounds (court edges)
                const topBound = 40;
                const bottomBound = H - 40;
                if (this.ball.y - this.ball.radius < topBound) {
                    this.ball.y = topBound + this.ball.radius;
                    this.ball.vy *= -0.9;
                }
                if (this.ball.y + this.ball.radius > bottomBound) {
                    this.ball.y = bottomBound - this.ball.radius;
                    this.ball.vy *= -0.9;
                }

                // Collisions with left/right walls -> point for opponent
                if (this.ball.x - this.ball.radius < 0) {
                    // right player wins point
                    this.pointWonBy(this.right);
                    return;
                }
                if (this.ball.x + this.ball.radius > W) {
                    this.pointWonBy(this.left);
                    return;
                }

                // Net collision (simple): if ball crosses net area and y near net, bounce or hit net
                const netTop = NET_Y - NET_HEIGHT / 2;
                const netBottom = NET_Y + NET_HEIGHT / 2;
                if (this.ball.x > COURT_MARGIN && this.ball.x < W - COURT_MARGIN) {
                    // if ball intersects net vertical band and low enough, reduce vx and bounce
                    if (this.ball.y + this.ball.radius > netTop && this.ball.y - this.ball.radius < netBottom) {
                        // hit net: slow down and reverse small vertical
                        this.ball.vx *= 0.2;
                        this.ball.vy *= -0.4;
                        // nudge ball slightly to avoid sticking
                        if (this.ball.x < W / 2) this.ball.x -= 6; else this.ball.x += 6;
                    }
                }

                // Paddle collisions
                this.checkPaddleCollision(this.left);
                this.checkPaddleCollision(this.right);

                // If ball falls into court (y beyond baseline) after bounce -> point logic simplified:
                // We already handle left/right out-of-bounds. For simplicity, we rely on wall checks.
            }

            checkPaddleCollision(player) {
                const b = this.ball;
                const p = player;
                const pb = p.getBounds();
                // Expand paddle bounds slightly for collision tolerance
                const pad = 6;
                if (b.x + b.radius > pb.x - pad && b.x - b.radius < pb.x + pb.w + pad &&
                    b.y + b.radius > pb.y - pad && b.y - b.radius < pb.y + pb.h + pad) {
                    // Determine collision normal and reflect
                    // Compute relative intersection on paddle vertical axis
                    const relY = (b.y - (pb.y + pb.h / 2)) / (pb.h / 2); // -1..1
                    // Angle change: more extreme when hitting near edges
                    const angle = relY * 0.6; // radians approx
                    // Speed increase slightly on hit
                    const speed = Math.hypot(b.vx, b.vy) || 6;
                    const newSpeed = clamp(speed * 1.06, 6, 18);
                    // Direction: if left paddle, send right; if right paddle, send left
                    const dir = p.side === 'left' ? 1 : -1;
                    // New velocity components
                    b.vx = dir * Math.cos(angle) * newSpeed;
                    b.vy = Math.sin(angle) * newSpeed * 0.9;
                    // Add paddle movement influence (spin)
                    const paddleVelY = (p.controls.up ? -p.speed : 0) + (p.controls.down ? p.speed : 0);
                    b.vy += paddleVelY * 0.18;
                    // Mark last hit
                    b.lastHitBy = p.side;
                    // Nudge ball out of paddle to avoid repeated collisions
                    if (dir === 1) b.x = pb.x + pb.w + b.radius + 2; else b.x = pb.x - b.radius - 2;
                }
            }

            pointWonBy(player) {
                // award game point to player (we treat each point as game point for simplicity)
                // For more realistic scoring, implement points (15,30,40,advantage). Here we increment games.
                player.games += 1;
                // Check match win
                const leftGames = this.left.games;
                const rightGames = this.right.games;
                // Win condition: first to MAX_SCORE with 2-game lead or reach MAX_GAMES
                let matchOver = false;
                if ((leftGames >= MAX_SCORE || rightGames >= MAX_SCORE) && Math.abs(leftGames - rightGames) >= 2) {
                    matchOver = true;
                }
                if (leftGames >= MAX_GAMES || rightGames >= MAX_GAMES) matchOver = true;

                if (matchOver) {
                    this.state = 'gameover';
                    this.updateHUD();
                    // show winner message briefly
                    setTimeout(() => {
                        alert(`Match terminé ! Vainqueur : ${this.left.games > this.right.games ? 'Gauche (Bleu)' : 'Droite (Rouge)'}`);
                        this.resetMatch();
                    }, 50);
                    return;
                }

                // Next serve: alternate server
                this.server = (this.server === this.left) ? this.right : this.left;
                this.receiver = (this.server === this.left) ? this.right : this.left;
                this.ball.reset();
                this.state = 'serve';
                this.updateHUD();
            }

            renderCourt() {
                // background court
                ctx.clearRect(0, 0, W, H);
                // draw grass/ground
                ctx.fillStyle = '#0b3b2e';
                ctx.fillRect(0, 0, W, H);

                // court rectangle with perspective shading
                const courtLeft = COURT_MARGIN;
                const courtRight = W - COURT_MARGIN;
                const courtTop = 40;
                const courtBottom = H - 40;
                // court base
                ctx.fillStyle = '#2b8f6b';
                ctx.fillRect(courtLeft, courtTop, courtRight - courtLeft, courtBottom - courtTop);

                // center line (net line)
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                // outer lines
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.strokeRect(courtLeft, courtTop, courtRight - courtLeft, courtBottom - courtTop);

                // service lines (approx)
                const midY = (courtTop + courtBottom) / 2;
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                // center service line vertical
                ctx.beginPath();
                ctx.moveTo(W / 2, courtTop);
                ctx.lineTo(W / 2, courtBottom);
                ctx.stroke();
                // service horizontal lines
                const serviceOffset = (courtBottom - courtTop) * 0.18;
                ctx.beginPath();
                ctx.moveTo(courtLeft, midY - serviceOffset);
                ctx.lineTo(courtRight, midY - serviceOffset);
                ctx.moveTo(courtLeft, midY + serviceOffset);
                ctx.lineTo(courtRight, midY + serviceOffset);
                ctx.stroke();
                ctx.setLineDash([]);

                // net
                ctx.fillStyle = '#e6e6e6';
                ctx.fillRect(courtLeft, midY - NET_HEIGHT / 2, courtRight - courtLeft, NET_HEIGHT);
                // net texture
                ctx.strokeStyle = 'rgba(0,0,0,0.08)';
                ctx.lineWidth = 1;
                for (let x = courtLeft; x < courtRight; x += 8) {
                    ctx.beginPath();
                    ctx.moveTo(x, midY - NET_HEIGHT / 2);
                    ctx.lineTo(x, midY + NET_HEIGHT / 2);
                    ctx.stroke();
                }
            }

            render() {
                this.renderCourt();
                // draw players and ball with perspective ordering (farther objects drawn first)
                // We'll sort by y to simulate depth
                const drawables = [this.left, this.right, this.ball];
                drawables.sort((a, b) => {
                    const ay = (a.y !== undefined) ? a.y + (a.height || 0) / 2 : a.y;
                    const by = (b.y !== undefined) ? b.y + (b.height || 0) / 2 : b.y;
                    return ay - by;
                });
                for (const d of drawables) {
                    d.draw();
                }

                // HUD overlay
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.fillRect(12, 12, 220, 56);
                ctx.fillStyle = '#fff';
                ctx.font = '18px sans-serif';
                ctx.fillText(`Score: ${this.left.games} - ${this.right.games}`, 20, 36);
                ctx.font = '13px sans-serif';
                ctx.fillText(`Serveur: ${this.server.side}`, 20, 54);

                // state message
                ctx.fillStyle = 'rgba(0,0,0,0.45)';
                ctx.fillRect(W - 260, 12, 240, 56);
                ctx.fillStyle = '#fff';
                ctx.font = '16px sans-serif';
                let stateMsg = this.state.toUpperCase();
                if (this.state === 'serve') stateMsg = `SERVE: ${this.server.side.toUpperCase()} (appuyez sur ${this.server.side === 'left' ? 'F' : 'K'})`;
                if (this.state === 'paused') stateMsg = 'PAUSE';
                ctx.fillText(stateMsg, W - 250, 36);
                ctx.font = '12px sans-serif';
                ctx.fillText('P: Pause • R: Reset', W - 250, 54);
            }
        }

        const game = new Game();

        /* Optional: add simple sound effects (uncomment and provide small audio files)
        const hitSound = new Audio('hit.wav');
        const scoreSound = new Audio('score.wav');
        function playHit(){ hitSound.currentTime = 0; hitSound.play(); }
        function playScore(){ scoreSound.currentTime = 0; scoreSound.play(); }
        */
    </script>
</body>

</html>
